; Pool PHP-FPM cho Zentea. Ghi đè giá trị mặc định của image (chỉ 5 worker).
; Mỗi worker Laravel dùng khoảng 40-60 MB RAM, 20 worker cần khoảng 1 GB.
; Khi deploy: max_children ≈ (RAM dành cho PHP) / (RAM mỗi worker).
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Khởi động lại worker sau 500 request để tránh rò rỉ bộ nhớ tích lũy.
pm.max_requests = 500
; Không để một request (ví dụ gọi API ngoài bị treo) giữ worker quá lâu.
request_terminate_timeout = 60s
