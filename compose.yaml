name: zentea
x-backend: &backend
 build: ./backend
 volumes:
  - ./backend:/var/www/html
  - backend-vendor:/var/www/html/vendor
  - ./docker/php.ini:/usr/local/etc/php/conf.d/zentea.ini:ro
  - ./docker/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-zentea.conf:ro
 environment:
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: zentea
  DB_USERNAME: zentea
  DB_PASSWORD: zentea_local
  REDIS_HOST: redis
  REVERB_HOST: reverb
 depends_on:
  postgres:
   condition: service_healthy
  redis:
   condition: service_started
services:
 postgres:
  image: postgres:16-alpine
  ports:
   - '127.0.0.1:5432:5432'
  environment:
   POSTGRES_DB: zentea
   POSTGRES_USER: zentea
   POSTGRES_PASSWORD: zentea_local
  volumes:
   - postgres-data:/var/lib/postgresql/data
  healthcheck:
   test: [CMD-SHELL, pg_isready -U zentea]
   interval: 5s
   timeout: 5s
   retries: 15
 redis:
  image: redis:7-alpine
 app:
  <<: *backend
 nginx:
  image: nginx:alpine
  ports:
   - '127.0.0.1:8000:80'
  volumes:
   - ./backend:/var/www/html:ro
   - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  depends_on: [app]
 reverb:
  <<: *backend
  command: php artisan reverb:start --host=0.0.0.0 --port=8080
  ports:
   - '127.0.0.1:8080:8080'
  restart: unless-stopped
 queue:
  <<: *backend
  command: php artisan queue:work --tries=3 --timeout=60 --sleep=1
  restart: unless-stopped
 frontend:
  image: node:22-alpine
  working_dir: /app
  volumes:
   - ./frontend:/app
   - frontend-modules:/app/node_modules
  command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
  ports:
   - '127.0.0.1:5173:5173'
  environment:
   API_PROXY_TARGET: http://nginx
volumes:
 postgres-data:
 frontend-modules:
 backend-vendor:




